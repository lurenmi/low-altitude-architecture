<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>低空数字孪生平台入口</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: #f6f8ff;
      color: #1f2937;
    }
    .box {
      width: min(760px, 92vw);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 8px 0; line-height: 1.7; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 6px; }
    a { color: #2563eb; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>低空数字孪生平台 1.0</h1>
    <p>你当前看到的页面是入口说明。新版“空域 3D 地图”在全栈服务里。</p>
    <p>请在项目根目录运行：<code>启动本地预览.ps1</code>（默认会启动全栈）。</p>
    <p>启动后访问：<a href="http://localhost:8090/" target="_blank" rel="noopener noreferrer">http://localhost:8090/</a></p>
    <p>如果你只想看旧静态原型，运行：<code>启动本地预览.ps1 -Static</code></p>
  </div>
</body>
</html>
